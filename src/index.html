        if (!localStorage.getItem('source')) localStorage.setItem('source', 'tmdb');
        // Load the engine assets bundled with this release.
        (function () {
            var assets = (window.__kadrAssets && window.__kadrAssets.js)
                ? window.__kadrAssets
                : { js: 'app.js', css: 'css/app.css?v=4.56' };

            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = assets.css;
            document.head.appendChild(link);

            window.__loadKadrCore = function () {
                var s = document.createElement('script');
                s.src = assets.js;
                s.onerror = function () {
                    if (assets.js === 'app.js') return;
                    // Downloaded core failed to load — fall back to the bundled one.
                    var f = document.createElement('script');
                    f.src = 'app.js';
                    document.body.appendChild(f);
                };
                document.body.appendChild(s);
            };
        })();
    </script>
